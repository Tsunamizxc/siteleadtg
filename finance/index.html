<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#1a1a1a">
  <title>Финансы — Cursiva</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Onest:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=1">
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar">
      <a class="brand" href="#dashboard">
        <div class="brand-mark">Cv</div>
        <div>
          <div class="brand-title">Cursiva</div>
          <div class="brand-sub">Finance</div>
        </div>
      </a>
      <nav class="nav" id="nav"></nav>
      <a class="nav-settings nav-office" href="../">← В офис</a>
      <button type="button" class="nav-settings" id="open-settings">Настройки</button>
    </aside>

    <div class="main-wrap">
      <header class="topbar">
        <button type="button" class="icon-btn" id="menu-toggle" aria-label="Меню">☰</button>
        <span class="topbar-title">Финансы</span>
        <a class="icon-btn topbar-office" href="../" aria-label="В офис">Офис</a>
        <button type="button" class="icon-btn" id="open-settings-mobile" aria-label="Настройки">⚙</button>
      </header>
      <main class="main" id="main">
        <div class="skeleton" id="skeleton">
          <div class="sk sk-title"></div>
          <div class="sk-grid">
            <div class="sk sk-card"></div>
            <div class="sk sk-card"></div>
            <div class="sk sk-card"></div>
          </div>
        </div>
        <div id="page" hidden></div>
      </main>
    </div>
  </div>

  <div class="overlay" id="overlay" hidden></div>

  <dialog class="modal" id="settings-modal">
    <form method="dialog" class="modal-inner">
      <header class="modal-head">
        <p class="eyebrow">Студия</p>
        <h2>Настройки</h2>
        <p>НПД, курсы, резерв. Данные хранятся в базе офиса и общие для всей команды.</p>
      </header>
      <div class="modal-body">
        <div class="month-kpi" id="settings-kpi"></div>
        <label>
          Налог самозанятого (НПД), %
          <input type="number" step="0.1" min="0" max="100" id="tax-percent">
          <span class="field-hint">Обычно 6% при оплате от юрлиц / ИП, 4% от физлиц.</span>
        </label>
        <div class="form-grid">
          <label>Курс USD, ₽<input type="number" step="0.01" id="rate-usd"></label>
          <label>Курс EUR, ₽<input type="number" step="0.01" id="rate-eur"></label>
        </div>
        <button type="button" class="btn" id="save-settings">Сохранить</button>
        <hr>
        <button type="button" class="btn btn-ghost" id="download-backup">Скачать резерв</button>
        <label class="file-label">
          Загрузить резерв
          <input type="file" accept="application/json" id="import-backup">
        </label>
        <button type="button" class="btn btn-ghost" id="reset-demo">Восстановить демо</button>
        <button type="button" class="btn btn-danger" id="clear-all-data">Удалить все данные</button>
        <p class="hint">Удаление очистит клиентов, проекты, счета, подписки и налоги у всей команды без возможности отмены.</p>
      </div>
      <footer class="modal-foot">
        <button type="submit" class="btn btn-ghost" value="cancel">Закрыть</button>
      </footer>
    </form>
  </dialog>

  <dialog class="modal modal-lg" id="form-modal">
    <div class="modal-inner">
      <header class="modal-head">
        <p class="eyebrow" id="form-eyebrow">Форма</p>
        <h2 id="form-title">Добавить</h2>
        <p id="form-desc"></p>
      </header>
      <div class="modal-body" id="form-body"></div>
      <footer class="modal-foot">
        <button type="button" class="btn btn-ghost" id="form-cancel">Отмена</button>
        <button type="button" class="btn" id="form-submit">Сохранить</button>
      </footer>
    </div>
  </dialog>

  <div class="toast" id="toast" hidden></div>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="app.js?v=1"></script>
</body>
</html>
